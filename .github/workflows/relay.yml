name: Deploy search relay

# Puts relay/ on Cloudflare Workers. Needs two repository secrets, CLOUDFLARE_API_TOKEN (made from the
# "Edit Cloudflare Workers" template) and CLOUDFLARE_ACCOUNT_ID. Without them it skips instead of failing.
on:
  push:
    branches: [main]
    paths: ['relay/**', '.github/workflows/relay.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Skip if the Cloudflare secrets aren't set yet
        if: env.HAS_SECRETS != 'true'
        run: echo "::notice::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings → Secrets and variables → Actions to deploy the relay."
      - uses: actions/checkout@v5
        if: env.HAS_SECRETS == 'true'
      - name: Deploy
        id: deploy
        if: env.HAS_SECRETS == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay
          wranglerVersion: "4.166.0"
      - name: Show the address
        if: env.HAS_SECRETS == 'true'
        run: |
          echo "Relay address: ${{ steps.deploy.outputs.deployment-url }}"
          echo "### Relay address: ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
